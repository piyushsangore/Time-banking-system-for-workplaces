<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="mb-3">Welcome {{ user.name }}</h2>

            <div class="alert alert-info">
              Credits Available: <strong>{{ user.credits }}</strong>
            </div>

            <div class="d-grid gap-2">
              <a href="{{ url_for('tasks.post_task') }}" class="btn btn-primary">Post Task</a>
              <a href="{{ url_for('tasks.browse_tasks') }}" class="btn btn-outline-primary">Browse Tasks</a>
              <a href="{{ url_for('tasks.my_tasks') }}" class="btn btn-outline-secondary">My Tasks</a>
              <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">Logout</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
